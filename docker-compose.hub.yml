# Stack inteira do Hub Community em Docker (REA-21): MySQL + Strapi do Hub, MySQL + Eventando,
# BFF e frontend, cada um com o compose de desenvolvimento do próprio repositório. Os quatro
# repositórios ficam lado a lado (../hub-community-backend etc.). Use pelo Makefile: make hub.
# Cada serviço lê o .env.dev do próprio repositório; eles se falam pelas portas da sua máquina.
name: hub-community-dev

include:
  - path: ../hub-community-backend/docker-compose.dev.yml
    env_file: ../hub-community-backend/.env.dev
  - path: ../eventando-manager/docker-compose.dev.yml
    env_file: ../eventando-manager/.env.dev
  - path: ../hub-community-bff/docker-compose.dev.yml
    env_file: ../hub-community-bff/.env.dev
  - path: docker-compose.dev.yml
    env_file: .env.dev
