name: CI

# Roda em runner do GitHub (nunca no thor): instala, lint (não bloqueia), testes e build.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Dívida antiga de lint; fica visível sem bloquear. (next lint saiu no Next 16.)
      - name: Lint (não bloqueia)
        continue-on-error: true
        run: pnpm exec eslint .

      - name: Run tests
        run: pnpm test

      - name: Testes dos scripts de deploy
        run: bash .github/scripts/env-scripts.test.sh

      # Valores fictícios e públicos só para o build do CI; o build de produção usa o .env
      # do servidor.
      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_GRAPHQL_URL: https://bff.example.invalid/
          NEXT_PUBLIC_SITE_URL: https://site.example.invalid
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-fake-api-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-fake.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-fake
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-fake.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
          NEXT_PUBLIC_FIREBASE_APP_ID: '1:000000000000:web:0000000000000000'
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: G-CIFAKE0000
